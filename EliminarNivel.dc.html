<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', Helvetica, Arial, sans-serif; }
    a { color: #0d6efd; } a:hover { color: #0a58ca; }
  </style>
</helmet>

<div style="width: 100%; height: 100%; background: #f8f9fa; display: flex; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box;">

  <div style="width: 440px; background: #ffffff; border-radius: 6px; box-shadow: 0 12px 40px rgba(0,0,0,0.18); overflow: hidden;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: #f8f9fa; border-bottom: 1px solid #dee2e6;">
      <div style="font-size: 15px; font-weight: 600; color: #2c3e50;">Eliminar nivel</div>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#6c757d" stroke-width="1.6" stroke-linecap="round">
        <path d="M3.5 3.5l9 9M12.5 3.5l-9 9"></path>
      </svg>
    </div>

    <div style="padding: 20px 16px;">
      <div style="display: flex; justify-content: center; margin-bottom: 12px;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ffc107" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.6L1.8 20.4h20.4L12 3.6z"></path>
          <path d="M12 9.6v4.8"></path>
          <path d="M12 17.4h.01"></path>
        </svg>
      </div>

      <p style="margin: 0 0 12px; font-size: 14px; color: #212529; line-height: 1.5;">
        Se eliminará el nivel <strong>Jefatura</strong> y sus aprobadores.
      </p>

      <p style="margin: 0; font-size: 12px; color: #6c757d; line-height: 1.5;">
        Los documentos que ya están circulando no se ven afectados: conservan los niveles con los que salieron.
      </p>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid #dee2e6;">
      <button style="font-family: inherit; font-size: 13px; font-weight: 500; color: #212529; background: #f8f9fa; border: 1px solid #ced4da; border-radius: 6px; padding: 6px 14px; cursor: pointer;">Cancelar</button>
      <button style="font-family: inherit; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #ffffff; background: #dc3545; border: 1px solid #dc3545; border-radius: 6px; padding: 6px 14px; cursor: pointer;">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 4h11M6 4V2.6h4V4M4 4l.7 9.2h6.6L12 4"></path>
        </svg>
        Sí, eliminar
      </button>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
