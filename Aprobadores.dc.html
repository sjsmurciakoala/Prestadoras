<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', Helvetica, Arial, sans-serif; }
    a { color: #0d6efd; } a:hover { color: #0a58ca; }
  </style>
</helmet>

<div style="width: 100%; height: 100%; background: #f8f9fa; display: flex; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box;">

  <div style="width: 620px; background: #ffffff; border-radius: 6px; box-shadow: 0 12px 40px rgba(0,0,0,0.18); overflow: hidden;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: #f8f9fa; border-bottom: 1px solid #dee2e6;">
      <div style="font-size: 15px; font-weight: 600; color: #2c3e50;">Aprobadores · Jefatura</div>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#6c757d" stroke-width="1.6" stroke-linecap="round">
        <path d="M3.5 3.5l9 9M12.5 3.5l-9 9"></path>
      </svg>
    </div>

    <div style="padding: 16px;">

      <div style="display: flex; gap: 12px; align-items: flex-end; margin-bottom: 16px;">
        <div style="flex: 0 0 150px;">
          <label style="display: block; font-size: 13px; font-weight: 600; color: #212529; margin-bottom: 4px;">Autorizar por</label>
          <div style="height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border: 1px solid #ced4da; border-radius: 6px; background: #fff;">
            <span style="font-size: 14px; color: #212529;">Usuario</span>
            <svg width="11" height="7" viewBox="0 0 11 7" fill="none" stroke="#6c757d" stroke-width="1.5" stroke-linecap="round"><path d="M1 1.5l4.5 4 4.5-4"></path></svg>
          </div>
        </div>
        <div style="flex: 1 1 auto;">
          <label style="display: block; font-size: 13px; font-weight: 600; color: #212529; margin-bottom: 4px;">Usuario</label>
          <div style="height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border: 1px solid #ced4da; border-radius: 6px; background: #fff;">
            <span style="font-size: 14px; color: #adb5bd;">Elija un usuario…</span>
            <svg width="11" height="7" viewBox="0 0 11 7" fill="none" stroke="#6c757d" stroke-width="1.5" stroke-linecap="round"><path d="M1 1.5l4.5 4 4.5-4"></path></svg>
          </div>
        </div>
        <button style="font-family: inherit; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #ffffff; background: #0d6efd; border: 1px solid #0d6efd; border-radius: 6px; padding: 6px 14px; height: 32px; cursor: pointer;">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 2.5v9M2.5 7h9"></path></svg>
          Agregar
        </button>
      </div>

      <ul style="list-style: none; margin: 0; padding: 0; border: 1px solid #dee2e6; border-radius: 6px;">
        <li style="display: flex; align-items: center; gap: 12px; padding: 8px 12px;">
          <span style="padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(255,193,7,0.15); color: #997404;">Usuario</span>
          <span style="flex: 1 1 auto; font-size: 14px; color: #212529;">admin@siad-demo.com</span>
          <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(220,53,69,0.10); display: flex; align-items: center; justify-content: center;">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#dc3545" stroke-width="1.8" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"></path></svg>
          </span>
        </li>
        <li style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-top: 1px solid #dee2e6;">
          <span style="padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(13,110,253,0.15); color: #0a58ca;">Rol</span>
          <span style="flex: 1 1 auto; font-size: 14px; color: #212529;">Compras</span>
          <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(220,53,69,0.10); display: flex; align-items: center; justify-content: center;">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#dc3545" stroke-width="1.8" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"></path></svg>
          </span>
        </li>
      </ul>

      <div style="font-size: 12px; color: #6c757d; margin-top: 8px; line-height: 1.45;">
        Dentro de un nivel firma <strong style="color: #495057;">cualquiera</strong> de sus aprobadores. Conviene dejar al menos dos, para que una ausencia no detenga las compras.
      </div>

    </div>

    <div style="display: flex; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid #dee2e6;">
      <button style="font-family: inherit; font-size: 13px; font-weight: 500; color: #212529; background: #f8f9fa; border: 1px solid #ced4da; border-radius: 6px; padding: 6px 14px; cursor: pointer;">Cerrar</button>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
