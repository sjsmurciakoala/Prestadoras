<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', Helvetica, Arial, sans-serif; }
    a { color: #0d6efd; } a:hover { color: #0a58ca; }
  </style>
</helmet>

<div style="width: 100%; height: 100%; background: #f8f9fa; display: flex; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box;">

  <div style="width: 430px; background: #ffffff; border-radius: 6px; box-shadow: 0 12px 40px rgba(0,0,0,0.18); overflow: hidden;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: #f8f9fa; border-bottom: 1px solid #dee2e6;">
      <div style="font-size: 15px; font-weight: 600; color: #2c3e50;">Confirmar acción</div>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#6c757d" stroke-width="1.6" stroke-linecap="round">
        <path d="M3.5 3.5l9 9M12.5 3.5l-9 9"></path>
      </svg>
    </div>

    <div style="padding: 24px 16px; text-align: center;">

      <div style="display: flex; justify-content: center; margin-bottom: 12px;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#198754" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9.4"></circle>
          <path d="M7.8 12.3l2.9 2.9 5.5-6"></path>
        </svg>
      </div>

      <h5 style="margin: 0 0 8px; font-size: 17px; font-weight: 700; color: #212529;">¿Enviar la orden a aprobación?</h5>

      <p style="margin: 0 0 16px; font-size: 13px; color: #6c757d; line-height: 1.5;">
        Dejará de ser editable y pasará por los niveles de aprobación que exija su monto.
      </p>

      <div style="font-size: 14px; font-weight: 600; color: #212529;">
        O/C 00001 — AGENCIA LA MUNDIAL
      </div>

      <div style="display: flex; justify-content: center; gap: 8px; margin-top: 24px;">
        <button style="font-family: inherit; font-size: 13px; font-weight: 500; color: #212529; background: #f8f9fa; border: 1px solid #ced4da; border-radius: 6px; padding: 6px 14px; cursor: pointer;">Volver</button>
        <button style="font-family: inherit; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #ffffff; background: #198754; border: 1px solid #198754; border-radius: 6px; padding: 6px 14px; cursor: pointer;">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.4l3 3L11.5 4"></path></svg>
          Sí, enviar
        </button>
      </div>

    </div>

  </div>
</div>
</x-dc>
</body>
</html>
