<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', Helvetica, Arial, sans-serif; }
    a { color: #0d6efd; } a:hover { color: #0a58ca; }
  </style>
</helmet>

<div style="width: 100%; height: 100%; background: #f8f9fa; display: flex; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box;">

  <div style="width: 480px; background: #ffffff; border-radius: 6px; box-shadow: 0 12px 40px rgba(0,0,0,0.18); overflow: hidden;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: #f8f9fa; border-bottom: 1px solid #dee2e6;">
      <div style="font-size: 15px; font-weight: 600; color: #2c3e50;">Nuevo nivel</div>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#6c757d" stroke-width="1.6" stroke-linecap="round">
        <path d="M3.5 3.5l9 9M12.5 3.5l-9 9"></path>
      </svg>
    </div>

    <div style="padding: 16px;">

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 13px; font-weight: 600; color: #212529; margin-bottom: 4px;">Nivel</label>
        <div style="display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 10px; border: 1px solid #0d6efd; border-radius: 6px; background: #fff;">
          <span style="font-size: 14px; color: #212529;">1</span>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <svg width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="#6c757d" stroke-width="1.4" stroke-linecap="round"><path d="M1 4.5L5 1.5l4 3"></path></svg>
            <svg width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="#6c757d" stroke-width="1.4" stroke-linecap="round"><path d="M1 1.5L5 4.5l4-3"></path></svg>
          </div>
        </div>
        <div style="font-size: 12px; color: #6c757d; margin-top: 4px; line-height: 1.4;">Orden de firma. El nivel 2 no se habilita hasta que firma el 1.</div>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 13px; font-weight: 600; color: #212529; margin-bottom: 4px;">Descripción</label>
        <div style="height: 32px; display: flex; align-items: center; padding: 0 10px; border: 1px solid #ced4da; border-radius: 6px; background: #fff;">
          <span style="font-size: 14px; color: #adb5bd;">Jefatura, Gerencia…</span>
        </div>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 13px; font-weight: 600; color: #212529; margin-bottom: 4px;">Monto desde</label>
        <div style="display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 10px; border: 1px solid #ced4da; border-radius: 6px; background: #fff;">
          <span style="font-size: 14px; color: #212529; font-variant-numeric: tabular-nums;">0.00</span>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <svg width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="#6c757d" stroke-width="1.4" stroke-linecap="round"><path d="M1 4.5L5 1.5l4 3"></path></svg>
            <svg width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="#6c757d" stroke-width="1.4" stroke-linecap="round"><path d="M1 1.5L5 4.5l4-3"></path></svg>
          </div>
        </div>
        <div style="font-size: 12px; color: #6c757d; margin-top: 4px; line-height: 1.4;">Se exige este nivel cuando el total del documento alcanza este monto. El primer nivel normalmente va en 0 para que toda compra pase por él.</div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 16px; height: 16px; border-radius: 3px; background: #0d6efd; display: flex; align-items: center; justify-content: center;">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3l2.4 2.4L9.6 3.9"></path></svg>
        </div>
        <span style="font-size: 14px; color: #212529;">Activo</span>
      </div>

    </div>

    <div style="display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid #dee2e6;">
      <button style="font-family: inherit; font-size: 13px; font-weight: 500; color: #212529; background: #f8f9fa; border: 1px solid #ced4da; border-radius: 6px; padding: 6px 14px; cursor: pointer;">Cancelar</button>
      <button style="font-family: inherit; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #ffffff; background: #0d6efd; border: 1px solid #0d6efd; border-radius: 6px; padding: 6px 14px; cursor: pointer;">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.4l3 3L11.5 4"></path></svg>
        Guardar
      </button>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
